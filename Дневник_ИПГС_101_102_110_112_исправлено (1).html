let profile=loadProfile(),selectedDate=dateOnly(new Date()),selectedYear=loadYear();
function dateOnly(d){d=new Date(d);d.setHours(0,0,0,0);return d}function wd(d){let x=d.getDay();return x===0?6:x-1}function fmt(d){return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}function full(d){return d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}function firstWeek(y){let d=new Date(y,8,1);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()===0?6:d.getDay()-1));return d}function acad(d){d=dateOnly(d);let y=d.getFullYear(),f=firstWeek(y);return d>=f?y:y-1}function aw(d){return Math.floor((dateOnly(d)-firstWeek(acad(d)))/86400000/7)+1}function parity(d){return aw(d)%2?'нечётная':'чётная'}function loadYear(){let y=Number(localStorage.getItem(KEY.year));return Number.isInteger(y)&&y>=2000&&y<=2100?y:acad(new Date())}function saveYear(){localStorage.setItem(KEY.year,String(selectedYear))}function loadProfile(){try{let p=JSON.parse(localStorage.getItem(KEY.profile));if(p&&A[p.faculty]&&A[p.faculty].groups[p.group])return{name:p.name||'',faculty:p.faculty,group:String(p.group)}}catch(e){}return{name:'',faculty:'ИПГС',group:'50'}}function saveProfile(){localStorage.setItem(KEY.profile,JSON.stringify(profile))}
function groupData(){return A[profile.faculty]?.groups[profile.group]||null}

/*
  Нормализация встроенного расписания.
  В исходной таблице две записи в одном и том же временном слоте означают
  разные недели: верхняя запись - нечётная, нижняя - чётная.
  Подгруппы в приложении не учитываются.
*/
function lessonsForDay(i){
  return (groupData()?.s[i]||[]).map(x=>({...x,weeks:[...(x.weeks||[])]}));
}
function matches(x,d){let w=aw(d);if(w<(x.fromWeek||1))return false;if(x.week==='specific')return x.weeks.includes(w);if(x.week==='even')return w%2===0;if(x.week==='odd')return w%2===1;return true}function tm(t){if(!t)return null;let p=t.split(':').map(Number);return p.length===2?p[0]*60+p[1]:null}function renderLesson(x){return `<div class="lesson"><div class="lesson-time"><div class="lesson-start">${esc(x.start)}</div><div class="lesson-end">${esc(x.end)}</div></div><div class="lesson-info"><div class="lesson-subject">${esc(x.subject)}</div><div class="lesson-meta">${x.room?`<span class="meta">Ауд. ${esc(x.room)}</span>`:''}${x.teacher?`<span class="meta">${esc(x.teacher)}</span>`:''}${x.week!=='all'||x.fromWeek>1?`<span class="meta week-badge">${esc(weekLabel(x))}</span>`:''}</div></div></div>`}function weekLabel(x){let s=x.week==='specific'?'Недели: '+x.weeks.join(', '):x.week==='even'?'Чётные недели':x.week==='odd'?'Нечётные недели':'Каждую неделю';return x.fromWeek>1?s+` · с ${x.fromWeek}-й`:s}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderHome(){let today=dateOnly(new Date()),w=aw(selectedDate),y=acad(selectedDate);document.getElementById('headerDate').textContent=fmt(today);document.getElementById('academicWeekHeader').textContent=`${y}/${y+1} · Неделя ${w}`;document.getElementById('selectedDateTitle').textContent=full(selectedDate);document.getElementById('selectedWeekInfo').textContent=`${w}-я учебная неделя · ${parity(selectedDate)}`;renderWeek();let arr=lessonsForDay(wd(selectedDate)).filter(x=>matches(x,selectedDate)).sort((a,b)=>(tm(a.start)||9999)-(tm(b.start)||9999));let html='';if(!arr.length)html='<div class="empty">На этот день занятий нет</div>';else arr.forEach((x,i)=>{if(i){let br=(tm(arr[i].start)||0)-(tm(arr[i-1].end)||0);if(br>0)html+=`<div class="break-between"><span class="break-text">Перерыв ${br} мин.</span></div>`}html+=renderLesson(x)});document.getElementById('homeLessons').innerHTML=html}function renderWeek(){let m=new Date(selectedDate);m.setDate(m.getDate()-wd(m));let h='';for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);let sel=d.getTime()===selectedDate.getTime(),tod=d.getTime()===dateOnly(new Date()).getTime();h+=`<button class="day ${sel?'selected':''} ${tod?'today':''}" onclick="selectDate(${d.getTime()})"><div class="day-name">${SHORT[i]}</div><div class="day-number">${d.getDate()}</div></button>`}document.getElementById('weekStrip').innerHTML=h}function selectDate(t){selectedDate=dateOnly(new Date(t));renderHome()}function changeWeek(n){selectedDate.setDate(selectedDate.getDate()+n*7);renderHome()}function goToday(){selectedDate=dateOnly(new Date());selectedYear=acad(selectedDate);saveYear();renderAcademicYear();renderHome()}
function renderFaculty(){let fs=Object.keys(A),h=fs.map(f=>`<option value="${esc(f)}" ${profile.faculty===f?'selected':''}>${esc(A[f].label)}</option>`).join('');document.getElementById('profileFacultySelect').innerHTML=h;document.getElementById('setupFaculty').innerHTML=h;renderGroups(document.getElementById('profileGroupSelect'),profile.faculty,profile.group)}function renderGroups(el,f,g){let o=A[f]?.groups||{};el.innerHTML=Object.entries(o).map(([k,v])=>`<option value="${k}" ${String(g)===String(k)?'selected':''}>${esc(f)} ${v.course}-${k}</option>`).join('')}function renderProfile(){let d=groupData(),n=profile.name.trim()||'Студент';document.getElementById('profileName').textContent=n;document.getElementById('profileAvatar').textContent=n[0].toUpperCase();document.getElementById('profileNameInline').value=profile.name;document.getElementById('profileFacultySelect').value=profile.faculty;renderGroups(document.getElementById('profileGroupSelect'),profile.faculty,profile.group);document.getElementById('profileInfo').textContent=`${profile.faculty} ${d.course}-${profile.group} · ${d.course} курс`;renderAcademicYear()}function changeFaculty(f){if(!A[f])return;profile.faculty=f;profile.group=Object.keys(A[f].groups)[0];saveProfile();renderProfile();renderHome();toast('Институт изменён')}function changeGroup(g){if(!A[profile.faculty]?.groups[g])return;profile.group=String(g);saveProfile();renderProfile();renderHome();toast(`Группа ${profile.faculty} ${groupData().course}-${g}`)}function renderSetupGroups(){let f=document.getElementById('setupFaculty').value;renderGroups(document.getElementById('setupGroup'),f,Object.keys(A[f].groups)[0])}function openSetup(){renderFaculty();document.getElementById('setupFaculty').value=profile.faculty;renderSetupGroups();document.getElementById('setupGroup').value=profile.group;document.getElementById('setupName').value=profile.name;document.getElementById('profileModal').classList.add('active')}function saveSetup(){let f=document.getElementById('setupFaculty').value,g=document.getElementById('setupGroup').value;if(!A[f]?.groups[g])return alert('Выберите институт и группу.');profile={name:document.getElementById('setupName').value.trim(),faculty:f,group:String(g)};saveProfile();renderProfile();renderHome();closeModal('profileModal');toast('Расписание загружено')}function resetProfile(){if(!confirm('Сбросить выбранную группу?'))return;localStorage.removeItem(KEY.profile);profile=loadProfile();renderProfile();renderHome();toast('Выбор группы сброшен')}
function renderAcademicYear(){let s=document.getElementById('academicYearSelect'),c=acad(new Date());s.innerHTML='';for(let y=c-2;y<=c+2;y++)s.innerHTML+=`<option value="${y}" ${y===selectedYear?'selected':''}>${y}/${y+1}</option>`}function changeAcademicYear(v){let y=Number(v);if(!Number.isInteger(y))return;selectedYear=y;saveYear();selectedDate=firstWeek(y);renderHome();renderAcademicYear()}function showScreen(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');if(id==='homeScreen')renderHome();else{renderFaculty();renderProfile();renderColors()}}function closeModal(id){document.getElementById(id).classList.remove('active')}function closeOutside(e,id){if(e.target.id===id)closeModal(id)}
function toggleDarkMode(v){document.body.classList.toggle('dark',v);localStorage.setItem(KEY.theme,v?'dark':'light')}function loadTheme(){let d=localStorage.getItem(KEY.theme)==='dark';document.body.classList.toggle('dark',d);document.getElementById('darkToggle').checked=d}function rgb(h){h=h.replace('#','');return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}}function applyAccent(c){document.documentElement.style.setProperty('--accent',c);let r=rgb(c);document.documentElement.style.setProperty('--accent-soft',`rgba(${r.r},${r.g},${r.b},.1)`);localStorage.setItem(KEY.accent,c);renderColors()}function loadAccent(){let c=localStorage.getItem(KEY.accent);applyAccent(/^#[\da-f]{6}$/i.test(c||'')?c:'#007aff')}function renderColors(){let e=document.getElementById('colorGrid');if(!e)return;let cur=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim().toLowerCase();e.innerHTML=COLORS.map(c=>`<button class="color-button ${c===cur?'active':''}" style="background:${c}" onclick="applyAccent('${c}')"></button>`).join('')}function toast(m){let e=document.getElementById('toast');e.textContent=m;e.style.cssText='position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:rgba(30,30,30,.9);color:#fff;padding:11px 16px;border-radius:13px;font-size:14px;z-index:200';setTimeout(()=>e.style.cssText='',1800)}document.getElementById('profileNameInline').addEventListener('blur',()=>{profile.name=document.getElementById('profileNameInline').value.trim();saveProfile();renderProfile()});
function init(){loadTheme();loadAccent();renderFaculty();renderProfile();renderHome();if(!localStorage.getItem(KEY.profile))setTimeout(openSetup,250)}init();
