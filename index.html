<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Дневник</title>

<style>
:root{
    --bg:#f2f2f7;
    --card:#ffffff;
    --text:#111111;
    --secondary:#6e6e73;
    --border:rgba(60,60,67,.12);
    --accent:#007aff;
    --accent-soft:rgba(0,122,255,.10);
    --danger:#ff3b30;
    --nav:rgba(249,249,249,.94);
    --shadow:0 2px 12px rgba(0,0,0,.06);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

body{
    min-height:100vh;
    padding-bottom:90px;
}

button,input,select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   HEADER
========================= */

.header{
    padding:
        calc(env(safe-area-inset-top) + 12px)
        18px
        10px;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.app-title{
    font-size:28px;
    font-weight:750;
    letter-spacing:-.7px;
}

.today-label{
    color:var(--secondary);
    font-size:14px;
    margin-top:3px;
}

.header-date{
    color:var(--accent);
    font-size:15px;
    font-weight:650;
}

/* =========================
   SCREENS
========================= */

.screen{
    display:none;
    padding:0 16px;
}

.screen.active{
    display:block;
}

/* =========================
   WEEK
========================= */

.week-navigation{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:4px 0 12px;
}

.week-title{
    font-size:17px;
    font-weight:700;
}

.week-info{
    color:var(--secondary);
    font-size:13px;
    margin-top:3px;
}

.week-arrows{
    display:flex;
    gap:6px;
}

.icon-button{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--card);
    color:var(--accent);
    box-shadow:var(--shadow);
    font-size:21px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.week-strip{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:20px;
}

.day{
    text-align:center;
    padding:9px 2px;
    border-radius:13px;
    background:var(--card);
    color:var(--text);
    box-shadow:var(--shadow);
    transition:.15s;
}

.day-name{
    font-size:11px;
    color:var(--secondary);
    font-weight:600;
}

.day-number{
    font-size:17px;
    font-weight:700;
    margin-top:3px;
}

.day.selected{
    background:var(--accent);
    color:#fff;
}

.day.selected .day-name{
    color:rgba(255,255,255,.82);
}

.day.today:not(.selected){
    outline:2px solid var(--accent);
    outline-offset:-2px;
}

/* =========================
   SECTIONS
========================= */

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:8px 2px 10px;
}

.section-title{
    font-size:21px;
    font-weight:750;
    letter-spacing:-.3px;
}

/* =========================
   LESSONS
========================= */

.lessons{
    display:flex;
    flex-direction:column;
    gap:0;
}

.lesson{
    position:relative;
    display:flex;
    background:var(--card);
    border-radius:18px;
    padding:15px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    overflow:hidden;
}

.lesson-time{
    min-width:70px;
    padding-right:12px;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.lesson-start{
    font-size:18px;
    font-weight:750;
    letter-spacing:-.3px;
}

.lesson-end{
    font-size:12px;
    color:var(--secondary);
    margin-top:3px;
}

.lesson-info{
    flex:1;
    min-width:0;
    padding-left:14px;
    padding-right:45px;
}

.lesson-subject{
    font-size:17px;
    font-weight:700;
    line-height:1.2;
    margin-bottom:7px;
}

.lesson-meta{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.meta{
    display:inline-flex;
    align-items:center;
    background:rgba(118,118,128,.10);
    color:var(--secondary);
    border-radius:7px;
    padding:4px 7px;
    font-size:11px;
}

.week-badge{
    color:var(--accent);
    background:var(--accent-soft);
}

.lesson-actions{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    gap:5px;
}

.small-action{
    width:31px;
    height:31px;
    border-radius:9px;
    background:rgba(118,118,128,.10);
    color:var(--accent);
    font-size:14px;
}

.small-action.delete{
    color:var(--danger);
}

.break-between{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:31px;
    margin:-2px 0 2px;
}

.break-between:before,
.break-between:after{
    content:"";
    height:1px;
    background:var(--border);
    flex:1;
}

.break-text{
    color:var(--secondary);
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
}

.empty{
    text-align:center;
    color:var(--secondary);
    background:var(--card);
    border-radius:18px;
    padding:35px 20px;
    box-shadow:var(--shadow);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:calc(70px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--nav);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    display:flex;
    z-index:30;
}

.nav-item{
    flex:1;
    background:transparent;
    color:var(--secondary);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:10px;
    font-weight:600;
}

.nav-icon{
    font-size:22px;
    line-height:1;
}

.nav-item.active{
    color:var(--accent);
}

/* =========================
   EDITOR
========================= */

.editor-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.page-title{
    font-size:28px;
    font-weight:750;
    letter-spacing:-.6px;
}

.add-button{
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--accent);
    color:white;
    font-size:24px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.day-selector{
    display:flex;
    overflow-x:auto;
    gap:7px;
    padding-bottom:7px;
    margin-bottom:15px;
    scrollbar-width:none;
}

.day-selector::-webkit-scrollbar{
    display:none;
}

.day-selector button{
    flex-shrink:0;
    padding:9px 14px;
    border-radius:12px;
    background:var(--card);
    color:var(--secondary);
}

.day-selector button.active{
    background:var(--accent);
    color:#fff;
}

/* =========================
   GRADES
========================= */

.grade-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.grade{
    background:var(--card);
    border-radius:18px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
}

.grade-value{
    width:42px;
    height:42px;
    border-radius:13px;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:800;
}

.grade-subject{
    flex:1;
    font-weight:650;
}

.grade-actions{
    display:flex;
    gap:5px;
}

/* =========================
   SETTINGS
========================= */

.profile-card{
    background:var(--card);
    border-radius:20px;
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:15px;
}

.profile-avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
    margin-bottom:13px;
}

.profile-name{
    font-size:21px;
    font-weight:750;
}

.profile-info{
    color:var(--secondary);
    font-size:14px;
    margin-top:5px;
}

.settings-group{
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    margin-bottom:15px;
    box-shadow:var(--shadow);
}

.settings-row{
    min-height:54px;
    padding:10px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.settings-row:last-child{
    border-bottom:0;
}

.settings-label{
    font-size:16px;
}

.settings-value{
    color:var(--secondary);
}

/* =========================
   COLOR PICKER
========================= */

.color-section{
    padding:15px;
}

.color-title{
    font-size:16px;
    margin-bottom:4px;
}

.color-description{
    color:var(--secondary);
    font-size:13px;
    margin-bottom:13px;
}

.color-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.color-button{
    width:100%;
    aspect-ratio:1;
    border-radius:14px;
    position:relative;
    border:3px solid transparent;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}

.color-button.active{
    border-color:var(--text);
}

.color-button.active:after{
    content:"✓";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:20px;
    font-weight:800;
    text-shadow:0 1px 3px rgba(0,0,0,.4);
}

/* =========================
   MODAL
========================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.38);
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    z-index:100;
    display:none;
    align-items:flex-end;
}

.modal-overlay.active{
    display:flex;
}

.modal{
    width:100%;
    max-height:92vh;
    overflow-y:auto;
    background:var(--card);
    border-radius:24px 24px 0 0;
    padding:10px 18px calc(20px + env(safe-area-inset-bottom));
    animation:slideUp .2s ease;
}

@keyframes slideUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
}

.modal-handle{
    width:38px;
    height:5px;
    border-radius:5px;
    background:#d1d1d6;
    margin:3px auto 18px;
}

.modal-title{
    font-size:23px;
    font-weight:750;
    margin-bottom:18px;
}

.form-group{
    margin-bottom:15px;
}

.form-label{
    display:block;
    color:var(--secondary);
    font-size:13px;
    margin:0 0 6px 4px;
}

.input,
.select{
    width:100%;
    height:48px;
    border:1px solid var(--border);
    border-radius:13px;
    padding:0 13px;
    background:var(--bg);
    color:var(--text);
    outline:none;
}

.input:focus,
.select:focus{
    border-color:var(--accent);
}

.time-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.week-mode{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.week-mode button{
    padding:11px 8px;
    border-radius:11px;
    background:var(--bg);
    color:var(--secondary);
    font-size:13px;
}

.week-mode button.active{
    background:var(--accent);
    color:#fff;
}

.specific-weeks{
    display:none;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
    margin-top:10px;
}

.specific-weeks.active{
    display:grid;
}

.week-number{
    height:34px;
    border-radius:9px;
    background:var(--bg);
    color:var(--secondary);
    font-size:12px;
}

.week-number.active{
    background:var(--accent);
    color:#fff;
}

.modal-buttons{
    display:flex;
    gap:9px;
    margin-top:20px;
}

.primary-button,
.secondary-button,
.danger-button{
    min-height:48px;
    border-radius:13px;
    padding:0 16px;
    font-weight:650;
    flex:1;
}

.primary-button{
    background:var(--accent);
    color:#fff;
}

.secondary-button{
    background:var(--bg);
    color:var(--text);
}

.danger-button{
    background:rgba(255,59,48,.1);
    color:var(--danger);
}

/* =========================
   DARK
========================= */

body.dark{
    --bg:#000;
    --card:#1c1c1e;
    --text:#f5f5f7;
    --secondary:#98989f;
    --border:rgba(255,255,255,.10);
    --nav:rgba(28,28,30,.94);
}

body.dark .input,
body.dark .select,
body.dark .week-mode button,
body.dark .week-number,
body.dark .secondary-button{
    background:#2c2c2e;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:calc(90px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);
    background:rgba(30,30,30,.9);
    color:#fff;
    padding:11px 16px;
    border-radius:13px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}
</style>
</head>

<body>

<header class="header">
    <div class="header-top">
        <div>
            <div class="app-title">Дневник</div>
            <div class="today-label" id="headerDate"></div>
        </div>

        <div class="header-date" id="academicWeekHeader"></div>
    </div>
</header>


<!-- ================= HOME ================= -->

<section class="screen active" id="homeScreen">

    <div class="week-navigation">

        <div>
            <div class="week-title" id="selectedDateTitle"></div>
            <div class="week-info" id="selectedWeekInfo"></div>
        </div>

        <div class="week-arrows">
            <button class="icon-button" onclick="changeWeek(-1)">‹</button>
            <button class="icon-button" onclick="changeWeek(1)">›</button>
        </div>

    </div>

    <div class="week-strip" id="weekStrip"></div>

    <div class="section-header">

        <div class="section-title">Расписание</div>

        <button
            class="secondary-button"
            style="flex:0;min-height:34px;padding:0 12px;font-size:12px"
            onclick="goToday()">
            Сегодня
        </button>

    </div>

    <div class="lessons" id="homeLessons"></div>

</section>


<!-- ================= EDITOR ================= -->

<section class="screen" id="editorScreen">

    <div class="editor-top">

        <div class="page-title">Пары</div>

        <!-- Добавление пар находится ТОЛЬКО здесь -->
        <button class="add-button" onclick="openLessonModal()">+</button>

    </div>

    <div class="day-selector" id="editorDays"></div>

    <div class="lessons" id="editorLessons"></div>

</section>


<!-- ================= GRADES ================= -->

<section class="screen" id="gradesScreen">

    <div class="editor-top">

        <div class="page-title">Оценки</div>

        <button class="add-button" onclick="openGradeModal()">+</button>

    </div>

    <div class="grade-list" id="gradeList"></div>

</section>


<!-- ================= SETTINGS ================= -->

<section class="screen" id="settingsScreen">

    <div class="page-title" style="margin:8px 0 18px">
        Профиль
    </div>

    <div class="profile-card">

        <div class="profile-avatar" id="profileAvatar">?</div>

        <div class="profile-name" id="profileName"></div>

        <div class="profile-info" id="profileInfo"></div>

    </div>


    <div class="settings-group">

        <div class="settings-row" onclick="openProfileModal()">

            <div class="settings-label">
                Редактировать профиль
            </div>

            <div class="settings-value">›</div>

        </div>


        <div class="settings-row">

            <div class="settings-label">
                Тёмная тема
            </div>

            <input
                type="checkbox"
                id="darkToggle"
                onchange="toggleDarkMode(this.checked)"
            >

        </div>

    </div>


    <!-- ВЫБОР ЦВЕТА -->

    <div class="settings-group">

        <div class="color-section">

            <div class="color-title">
                Цвет интерфейса
            </div>

            <div class="color-description">
                Выберите основной цвет приложения
            </div>

            <div class="color-grid" id="colorGrid"></div>

        </div>

    </div>


    <div class="settings-group">

        <div class="settings-row" onclick="clearAllData()">

            <div
                class="settings-label"
                style="color:var(--danger)">
                Удалить все данные
            </div>

            <div class="settings-value">›</div>

        </div>

    </div>

</section>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <button
        class="nav-item active"
        onclick="showScreen('homeScreen',this)">

        <span class="nav-icon">⌂</span>
        <span>Главная</span>

    </button>

    <button
        class="nav-item"
        onclick="showScreen('editorScreen',this)">

        <span class="nav-icon">☷</span>
        <span>Пары</span>

    </button>

    <button
        class="nav-item"
        onclick="showScreen('gradesScreen',this)">

        <span class="nav-icon">★</span>
        <span>Оценки</span>

    </button>

    <button
        class="nav-item"
        onclick="showScreen('settingsScreen',this)">

        <span class="nav-icon">⚙</span>
        <span>Профиль</span>

    </button>

</nav>


<!-- ================= LESSON MODAL ================= -->

<div
    class="modal-overlay"
    id="lessonModal"
    onclick="closeModalOutside(event,'lessonModal')">

    <div class="modal">

        <div class="modal-handle"></div>

        <div class="modal-title" id="lessonModalTitle">
            Новая пара
        </div>

        <div class="form-group">

            <label class="form-label">Предмет</label>

            <input
                class="input"
                id="lessonSubject"
                placeholder="Например, Математика">

        </div>


        <div class="time-row">

            <div class="form-group">

                <label class="form-label">Начало</label>

                <input
                    class="input"
                    id="lessonStart"
                    type="time">

            </div>

            <div class="form-group">

                <label class="form-label">Конец</label>

                <input
                    class="input"
                    id="lessonEnd"
                    type="time">

            </div>

        </div>


        <div class="form-group">

            <label class="form-label">Аудитория</label>

            <input
                class="input"
                id="lessonRoom"
                placeholder="Например, 305">

        </div>


        <div class="form-group">

            <label class="form-label">
                Преподаватель
            </label>

            <input
                class="input"
                id="lessonTeacher"
                placeholder="Фамилия И.О.">

        </div>


        <div class="form-group">

            <label class="form-label">
                Повторение
            </label>

            <div class="week-mode">

                <button
                    data-week-mode="all"
                    onclick="setLessonWeekMode('all')">
                    Каждую неделю
                </button>

                <button
                    data-week-mode="even"
                    onclick="setLessonWeekMode('even')">
                    Чётные
                </button>

                <button
                    data-week-mode="odd"
                    onclick="setLessonWeekMode('odd')">
                    Нечётные
                </button>

                <button
                    data-week-mode="specific"
                    onclick="setLessonWeekMode('specific')">
                    Конкретные
                </button>

            </div>

            <div
                class="specific-weeks"
                id="specificWeeks">
            </div>

        </div>


        <div class="modal-buttons">

            <button
                class="secondary-button"
                onclick="closeModal('lessonModal')">
                Отмена
            </button>

            <button
                class="primary-button"
                onclick="saveLesson()">
                Сохранить
            </button>

        </div>


        <button
            class="danger-button hidden"
            style="width:100%;margin-top:9px"
            id="deleteLessonButton"
            onclick="deleteEditingLesson()">
            Удалить пару
        </button>

    </div>

</div>


<!-- ================= GRADE MODAL ================= -->

<div
    class="modal-overlay"
    id="gradeModal"
    onclick="closeModalOutside(event,'gradeModal')">

    <div class="modal">

        <div class="modal-handle"></div>

        <div class="modal-title" id="gradeModalTitle">
            Новая оценка
        </div>

        <div class="form-group">

            <label class="form-label">Предмет</label>

            <input
                class="input"
                id="gradeSubject"
                placeholder="Например, История">

        </div>

        <div class="form-group">

            <label class="form-label">Оценка</label>

            <input
                class="input"
                id="gradeValue"
                type="number"
                min="1"
                max="5"
                step="1"
                placeholder="5">

        </div>

        <div class="modal-buttons">

            <button

<script>
/* =========================================================
   STORAGE
========================================================= */

const STORAGE_SCHEDULE =
    "student_diary_schedule_v7";

const STORAGE_GRADES =
    "student_diary_grades_v7";

const STORAGE_PROFILE =
    "student_diary_profile_v7";

const STORAGE_THEME =
    "student_diary_theme_v7";

const STORAGE_ACCENT =
    "student_diary_accent_v7";


/* =========================================================
   DAYS
========================================================= */

const DAYS = [
    "Понедельник",
    "Вторник",
    "Среда",
    "Четверг",
    "Пятница",
    "Суббота",
    "Воскресенье"
];

const SHORT_DAYS = [
    "Пн",
    "Вт",
    "Ср",
    "Чт",
    "Пт",
    "Сб",
    "Вс"
];


/* =========================================================
   ACCENT COLORS
========================================================= */

const ACCENT_COLORS = [
    "#007aff",
    "#5856d6",
    "#af52de",
    "#ff2d55",
    "#ff3b30",
    "#ff9500",
    "#ffcc00",
    "#34c759",
    "#00c7be",
    "#30b0c7"
];


/* =========================================================
   STATE
========================================================= */

let schedule = loadSchedule();
let grades = loadGrades();
let profile = loadProfile();

let selectedDate = new Date();
selectedDate.setHours(0,0,0,0);

let editorDay = weekdayIndex(new Date());

let editingLessonId = null;
let editingGradeId = null;

let selectedLessonWeekMode = "all";
let selectedSpecificWeeks = [];


/* =========================================================
   STORAGE FUNCTIONS
========================================================= */

function loadSchedule(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    STORAGE_SCHEDULE
                )
            );

        if(saved){
            return normalizeSchedule(saved);
        }

    }catch(e){}

    return [[],[],[],[],[],[],[]];
}


function normalizeSchedule(data){

    const result =
        [[],[],[],[],[],[],[]];

    for(let i=0;i<7;i++){

        if(Array.isArray(data[i])){

            result[i] =
                data[i].map(normalizeLesson);

        }

    }

    return result;
}


function loadGrades(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    STORAGE_GRADES
                )
            );

        if(Array.isArray(saved)){

            return saved.map(g => ({

                id:
                    g.id != null
                        ? String(g.id)
                        : generateId(),

                subject:g.subject || "",

                value:g.value

            }));

        }

    }catch(e){}

    return [];
}


function loadProfile(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    STORAGE_PROFILE
                )
            );

        if(saved){

            return {

                name:saved.name || "",

                group:saved.group || "",

                course:saved.course || "",

                faculty:saved.faculty || ""

            };

        }

    }catch(e){}

    return {
        name:"",
        group:"",
        course:"",
        faculty:""
    };
}


function saveSchedule(){

    localStorage.setItem(
        STORAGE_SCHEDULE,
        JSON.stringify(schedule)
    );
}


function saveGrades(){

    localStorage.setItem(
        STORAGE_GRADES,
        JSON.stringify(grades)
    );
}


function saveProfileData(){

    localStorage.setItem(
        STORAGE_PROFILE,
        JSON.stringify(profile)
    );
}


/* =========================================================
   HELPERS
========================================================= */

function generateId(){

    return Date.now().toString(36) +
        Math.random()
            .toString(36)
            .slice(2,8);
}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function dateOnly(date){

    const d = new Date(date);

    d.setHours(0,0,0,0);

    return d;
}


function weekdayIndex(date){

    const day = date.getDay();

    return day === 0 ? 6 : day - 1;
}


function formatDate(date){

    return date.toLocaleDateString(
        "ru-RU",
        {
            day:"numeric",
            month:"long"
        }
    );
}


function formatFullDate(date){

    return date.toLocaleDateString(
        "ru-RU",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    );
}


/* =========================================================
   ACADEMIC WEEK
========================================================= */

function getFirstAcademicWeekStart(
    academicYearStart
){

    const septemberFirst =
        new Date(
            academicYearStart,
            8,
            1
        );

    septemberFirst.setHours(0,0,0,0);

    const day =
        septemberFirst.getDay();

    const daysFromMonday =
        day === 0 ? 6 : day - 1;

    const firstWeekStart =
        new Date(septemberFirst);

    firstWeekStart.setDate(
        firstWeekStart.getDate() -
        daysFromMonday
    );

    firstWeekStart.setHours(0,0,0,0);

    return firstWeekStart;
}


function getAcademicYear(date){

    const currentDate =
        dateOnly(date);

    const year =
        currentDate.getFullYear();

    const currentAcademicYearStart =
        getFirstAcademicWeekStart(year);

    if(
        currentDate >=
        currentAcademicYearStart
    ){

        return {
            startYear:year,
            endYear:year+1
        };

    }

    return {
        startYear:year-1,
        endYear:year
    };
}


function getAcademicWeek(date){

    const currentDate =
        dateOnly(date);

    const academicYear =
        getAcademicYear(currentDate);

    const firstWeekStart =
        getFirstAcademicWeekStart(
            academicYear.startYear
        );

    const difference =
        currentDate.getTime() -
        firstWeekStart.getTime();

    const daysPassed =
        Math.floor(
            difference / 86400000
        );

    return Math.floor(
        daysPassed / 7
    ) + 1;
}


function getWeekParity(date){

    return getAcademicWeek(date) % 2 === 0
        ? "even"
        : "odd";
}


/* =========================================================
   LESSON NORMALIZATION
========================================================= */

function normalizeLesson(lesson){

    let week =
        lesson.week || "all";

    if(
        ![
            "all",
            "even",
            "odd",
            "specific"
        ].includes(week)
    ){
        week = "all";
    }

    let weeks = [];

    if(Array.isArray(lesson.weeks)){

        weeks =
            lesson.weeks
                .map(Number)
                .filter(
                    n =>
                        Number.isInteger(n) &&
                        n >= 1 &&
                        n <= 52
                )
                .filter(
                    (v,i,a) =>
                        a.indexOf(v) === i
                )
                .sort(
                    (a,b)=>a-b
                );
    }

    return {

        id:
            lesson.id != null &&
            String(lesson.id) !== ""
                ? String(lesson.id)
                : generateId(),

        subject:lesson.subject || "",

        start:lesson.start || "",

        end:lesson.end || "",

        room:lesson.room || "",

        teacher:lesson.teacher || "",

        week,

        weeks

    };
}


function lessonMatchesDate(
    lesson,
    date
){

    if(lesson.week === "all"){
        return true;
    }

    if(lesson.week === "even"){

        return (
            getAcademicWeek(date) % 2
        ) === 0;
    }

    if(lesson.week === "odd"){

        return (
            getAcademicWeek(date) % 2
        ) === 1;
    }

    if(lesson.week === "specific"){

        return (
            Array.isArray(lesson.weeks) &&
            lesson.weeks.includes(
                getAcademicWeek(date)
            )
        );
    }

    return true;
}


function findLessonById(id){

    const target =
        String(id);

    for(let day=0;day<7;day++){

        const index =
            schedule[day].findIndex(
                lesson =>
                    String(lesson.id) ===
                    target
            );

        if(index !== -1){

            return {
                day,
                index,
                lesson:
                    schedule[day][index]
            };
        }
    }

    return null;
}


/* =========================================================
   TIME / BREAK
========================================================= */

function timeToMinutes(time){

    if(!time){
        return null;
    }

    const parts =
        String(time).split(":");

    if(parts.length !== 2){
        return null;
    }

    const hours =
        Number(parts[0]);

    const minutes =
        Number(parts[1]);

    if(
        Number.isNaN(hours) ||
        Number.isNaN(minutes)
    ){
        return null;
    }

    return hours * 60 + minutes;
}


function lessonStartSortValue(lesson){

    const value =
        timeToMinutes(
            lesson.start || ""
        );

    return value === null
        ? 9999
        : value;
}


function getBreakMinutes(
    previousLesson,
    nextLesson
){

    if(
        !previousLesson ||
        !nextLesson ||
        !previousLesson.end ||
        !nextLesson.start
    ){
        return null;
    }

    const previousEnd =
        timeToMinutes(
            previousLesson.end
        );

    const nextStart =
        timeToMinutes(
            nextLesson.start
        );

    if(
        previousEnd === null ||
        nextStart === null
    ){
        return null;
    }

    const difference =
        nextStart - previousEnd;

    if(difference <= 0){
        return null;
    }

    return difference;
}


function formatBreak(minutes){

    if(minutes === 1){
        return "1 минута";
    }

    if(
        minutes >= 2 &&
        minutes <= 4
    ){
        return `${minutes} минуты`;
    }

    return `${minutes} минут`;
}


/* =========================================================
   RENDER LESSONS
========================================================= */

function getWeekLabel(lesson){

    if(lesson.week === "even"){
        return "Чётная неделя";
    }

    if(lesson.week === "odd"){
        return "Нечётная неделя";
    }

    if(lesson.week === "specific"){

        if(
            Array.isArray(lesson.weeks) &&
            lesson.weeks.length
        ){

            return (
                "Недели: " +
                lesson.weeks.join(", ")
            );
        }

        return "Конкретные недели";
    }

    return "Каждую неделю";
}


function renderLesson(
    lesson,
    editorMode=false
){

    const start =
        escapeHtml(
            lesson.start || "—"
        );

    const end =
        escapeHtml(
            lesson.end || ""
        );

    const subject =
        escapeHtml(
            lesson.subject ||
            "Без названия"
        );

    const room =
        escapeHtml(
            lesson.room || ""
        );

    const teacher =
        escapeHtml(
            lesson.teacher || ""
        );

    const week =
        escapeHtml(
            getWeekLabel(lesson)
        );

    return `

        <div class="lesson">

            <div class="lesson-time">

                <div class="lesson-start">
                    ${start}
                </div>

                ${
                    end
                        ? `
                            <div class="lesson-end">
                                ${end}
                            </div>
                        `
                        : ""
                }

            </div>


            <div class="lesson-info">

                <div class="lesson-subject">
                    ${subject}
                </div>

                <div class="lesson-meta">

                    ${
                        room
                            ? `
                                <span class="meta">
                                    Ауд. ${room}
                                </span>
                            `
                            : ""
                    }

                    ${
                        teacher
                            ? `
                                <span class="meta">
                                    ${teacher}
                                </span>
                            `
                            : ""
                    }

                    <span class="meta week-badge">
                        ${week}
                    </span>

                </div>

            </div>


            ${
                editorMode
                    ? `

                        <div class="lesson-actions">

                            <button
                                class="small-action"
                                onclick="
                                    openLessonModal(
                                        '${escapeHtml(lesson.id)}'
                                    )
                                ">
                                ✎
                            </button>

                            <button
                                class="small-action delete"
                                onclick="
                                    deleteLesson(
                                        '${escapeHtml(lesson.id)}'
                                    )
                                ">
                                ×
                            </button>

                        </div>

                    `
                    : ""
            }

        </div>
    `;
}


function renderLessonsWithBreaks(
    lessons,
    editorMode=false
){

    if(!lessons.length){

        return `
            <div class="empty">
                На этот день занятий нет
            </div>
        `;
    }

    const sortedLessons =
        [...lessons].sort(
            (a,b) =>
                lessonStartSortValue(a) -
                lessonStartSortValue(b)
        );

    let html = "";

    sortedLessons.forEach(
        (lesson,index)=>{

            if(index > 0){

                const previous =
                    sortedLessons[index - 1];

                const breakMinutes =
                    getBreakMinutes(
                        previous,
                        lesson
                    );

                if(
                    breakMinutes !== null
                ){

                    html += `
                        <div class="break-between">

                            <span class="break-text">
                                Перерыв
                                ${formatBreak(breakMinutes)}
                            </span>

                        </div>
                    `;
                }
            }

            html +=
                renderLesson(
                    lesson,
                    editorMode
                );
        }
    );

    return html;
}


/* =========================================================
   HOME
========================================================= */

function renderHome(){

    const today =
        dateOnly(new Date());

    /*
       ВАЖНО:
       headerDate всегда сегодня.
       selectedDate используется только
       для просмотра расписания.
    */

    document.getElementById(
        "headerDate"
    ).textContent =
        formatDate(today);

    const week =
        getAcademicWeek(
            selectedDate
        );

    document.getElementById(
        "academicWeekHeader"
    ).textContent =
        `Неделя ${week}`;

    document.getElementById(
        "selectedDateTitle"
    ).textContent =
        formatFullDate(
            selectedDate
        );

    document.getElementById(
        "selectedWeekInfo"
    ).textContent =
        `${week}-я учебная неделя · ${
            getWeekParity(selectedDate)
            === "even"
                ? "чётная"
                : "нечётная"
        }`;

    renderWeekStrip();

    const day =
        weekdayIndex(selectedDate);

    const lessons =
        schedule[day].filter(
            lesson =>
                lessonMatchesDate(
                    lesson,
                    selectedDate
                )
        );

    document.getElementById(
        "homeLessons"
    ).innerHTML =
        renderLessonsWithBreaks(
            lessons,
            false
        );
}


function renderWeekStrip(){

    const monday =
        new Date(selectedDate);

    monday.setDate(
        monday.getDate() -
        weekdayIndex(monday)
    );

    let html = "";

    for(let i=0;i<7;i++){

        const date =
            new Date(monday);

        date.setDate(
            monday.getDate() + i
        );

        const isSelected =
            date.getTime() ===
            selectedDate.getTime();

        const isToday =
            date.getTime() ===
            dateOnly(new Date()).getTime();

        html += `

            <button
                class="
                    day
                    ${isSelected ? "selected" : ""}
                    ${isToday ? "today" : ""}
                "
                onclick="
                    selectDate(
                        ${date.getTime()}
                    )
                ">

                <div class="day-name">
                    ${SHORT_DAYS[i]}
                </div>

                <div class="day-number">
                    ${date.getDate()}
                </div>

            </button>
        `;
    }

    document.getElementById(
        "weekStrip"
    ).innerHTML = html;
}


function selectDate(timestamp){

    selectedDate =
        dateOnly(
            new Date(timestamp)
        );

    renderHome();
}


function changeWeek(direction){

    selectedDate.setDate(
        selectedDate.getDate() +
        direction * 7
    );

    renderHome();
}


function goToday(){

    selectedDate =
        dateOnly(new Date());

    renderHome();
}


/* =========================================================
   EDITOR
========================================================= */

function renderEditor(){

    document.getElementById(
        "editorDays"
    ).innerHTML =

        DAYS.map(
            (day,index)=>`

                <button
                    class="${
                        editorDay === index
                            ? "active"
                            : ""
                    }"
                    onclick="
                        selectEditorDay(
                            ${index}
                        )
                    ">
                    ${day}
                </button>
            `
        ).join("");

    document.getElementById(
        "editorLessons"
    ).innerHTML =

        renderLessonsWithBreaks(
            schedule[editorDay],
            true
        );
}


function selectEditorDay(day){

    editorDay = day;

    renderEditor();
}


/* =========================================================
   LESSON MODAL
========================================================= */

function createSpecificWeekButtons(){

    const container =
        document.getElementById(
            "specificWeeks"
        );

    let html = "";

    for(let i=1;i<=52;i++){

        html += `

            <button
                class="
                    week-number
                    ${
                        selectedSpecificWeeks
                            .includes(i)
                            ? "active"
                            : ""
                    }
                "
                onclick="
                    toggleSpecificWeek(
                        ${i}
                    )
                ">
                ${i}
            </button>
        `;
    }

    container.innerHTML = html;
}


function setLessonWeekMode(mode){

    selectedLessonWeekMode =
        mode;

    document
        .querySelectorAll(
            "[data-week-mode]"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.weekMode ===
                mode
            );

        });

    const weeks =
        document.getElementById(
            "specificWeeks"
        );

    weeks.classList.toggle(
        "active",
        mode === "specific"
    );

    if(mode === "specific"){
        createSpecificWeekButtons();
    }
}


function toggleSpecificWeek(week){

    if(
        selectedSpecificWeeks
            .includes(week)
    ){

        selectedSpecificWeeks =
            selectedSpecificWeeks
                .filter(
                    n => n !== week
                );

    }else{

        selectedSpecificWeeks.push(
            week
        );

        selectedSpecificWeeks.sort(
            (a,b)=>a-b
        );
    }

    createSpecificWeekButtons();
}


function openLessonModal(id=null){

    editingLessonId =
        id !== null
            ? String(id)
            : null;

    document.getElementById(
        "lessonModalTitle"
    ).textContent =

        editingLessonId
            ? "Редактировать пару"
            : "Новая пара";


    if(editingLessonId){

        const found =
            findLessonById(
                editingLessonId
            );

        if(!found){

            showToast(
                "Пара не найдена"
            );

            return;
        }

        const lesson =
            found.lesson;

        document.getElementById(
            "lessonSubject"
        ).value =
            lesson.subject;

        document.getElementById(
            "lessonStart"
        ).value =
            lesson.start;

        document.getElementById(
            "lessonEnd"
        ).value =
            lesson.end;

        document.getElementById(
            "lessonRoom"
        ).value =
            lesson.room;

        document.getElementById(
            "lessonTeacher"
        ).value =
            lesson.teacher;

        selectedLessonWeekMode =
            lesson.week || "all";

        selectedSpecificWeeks =
            Array.isArray(lesson.weeks)
                ? [...lesson.weeks]
                : [];

        document.getElementById(
            "deleteLessonButton"
        ).classList.remove(
            "hidden"
        );

    }else{

        document.getElementById(
            "lessonSubject"
        ).value = "";

        document.getElementById(
            "lessonStart"
        ).value = "";

        document.getElementById(
            "lessonEnd"
        ).value = "";

        document.getElementById(
            "lessonRoom"
        ).value = "";

        document.getElementById(
            "lessonTeacher"
        ).value = "";

        selectedLessonWeekMode =
            "all";

        selectedSpecificWeeks =
            [];

        document.getElementById(
            "deleteLessonButton"
        ).classList.add(
            "hidden"
        );
    }

    setLessonWeekMode(
        selectedLessonWeekMode
    );

    document.getElementById(
        "lessonModal"
    ).classList.add("active");
}


function saveLesson(){

    const subject =
        document.getElementById(
            "lessonSubject"
        ).value.trim();

    const start =
        document.getElementById(
            "lessonStart"
        ).value;

    const end =
        document.getElementById(
            "lessonEnd"
        ).value;

    const room =
        document.getElementById(
            "lessonRoom"
        ).value.trim();

    const teacher =
        document.getElementById(
            "lessonTeacher"
        ).value.trim();

    if(!subject){

        alert(
            "Введите название предмета."
        );

        return;
    }

    const startMinutes =
        timeToMinutes(start);

    const endMinutes =
        timeToMinutes(end);

    if(
        startMinutes !== null &&
        endMinutes !== null &&
        startMinutes >= endMinutes
    ){

        alert(
            "Время окончания должно быть позже времени начала."
        );

        return;
    }

    if(
        selectedLessonWeekMode ===
            "specific" &&
        selectedSpecificWeeks.length === 0
    ){

        alert(
            "Выберите хотя бы одну неделю."
        );

        return;
    }

    const lesson = {

        id:
            editingLessonId ||
            generateId(),

        subject,

        start,

        end,

        room,

        teacher,

        week:
            selectedLessonWeekMode,

        weeks:
            selectedLessonWeekMode ===
                "specific"
                ? [...selectedSpecificWeeks]
                : []

    };


    if(editingLessonId){

        const found =
            findLessonById(
                editingLessonId
            );

        if(!found){

            alert(
                "Не удалось найти пару."
            );

            return;
        }

        schedule[
            found.day
        ][
            found.index
        ] = lesson;

    }else{

        schedule[
            editorDay
        ].push(lesson);
    }

    saveSchedule();

    closeModal(
        "lessonModal"
    );

    renderHome();
    renderEditor();

    showToast(
        editingLessonId
            ? "Пара изменена"
            : "Пара добавлена"
    );

    editingLessonId = null;
}


function deleteLesson(id){

    const found =
        findLessonById(id);

    if(!found){
        return;
    }

    if(
        !confirm(
            `Удалить пару «${found.lesson.subject}»?`
        )
    ){
        return;
    }

    schedule[
        found.day
    ].splice(
        found.index,
        1
    );

    saveSchedule();

    renderHome();
    renderEditor();

    showToast(
        "Пара удалена"
    );
}


function deleteEditingLesson(){

    if(!editingLessonId){
        return;
    }

    deleteLesson(
        editingLessonId
    );

    closeModal(
        "lessonModal"
    );

    editingLessonId = null;
}


/* =========================================================
   GRADES
========================================================= */

function renderGrades(){

    const container =
        document.getElementById(
            "gradeList"
        );

    if(!grades.length){

        container.innerHTML = `
            <div class="empty">
                Оценок пока нет
            </div>
        `;

        return;
    }

    container.innerHTML =
        grades.map(
            grade => `

                <div class="grade">

                    <div class="grade-value">
                        ${escapeHtml(
                            grade.value
                        )}
                    </div>

                    <div class="grade-subject">
                        ${escapeHtml(
                            grade.subject
                        )}
                    </div>

                    <div class="grade-actions">

                        <button
                            class="small-action"
                            onclick="
                                openGradeModal(
                                    '${escapeHtml(
                                        grade.id
                                    )}'
                                )
                            ">
                            ✎
                        </button>

                        <button
                            class="
                                small-action
                                delete
                            "
                            onclick="
                                deleteGrade(
                                    '${escapeHtml(
                                        grade.id
                                    )}'
                                )
                            ">
                            ×
                        </button>

                    </div>

                </div>
            `
        ).join("");
}


function openGradeModal(id=null){

    editingGradeId =
        id !== null
            ? String(id)
            : null;

    const title =
        document.getElementById(
            "gradeModalTitle"
        );

    const deleteButton =
        document.getElementById(
            "deleteGradeButton"
        );

    if(editingGradeId){

        const grade =
            grades.find(
                g =>
                    String(g.id) ===
                    editingGradeId
            );

        if(!grade){
            return;
        }

        document.getElementById(
            "gradeSubject"
        ).value =
            grade.subject;

        document.getElementById(
            "gradeValue"
        ).value =
            grade.value;

        title.textContent =
            "Редактировать оценку";

        deleteButton.classList.remove(
            "hidden"
        );

    }else{

        document.getElementById(
            "gradeSubject"
        ).value = "";

        document.getElementById(
            "gradeValue"
        ).value = "";

        title.textContent =
            "Новая оценка";

        deleteButton.classList.add(
            "hidden"
        );
    }

    document.getElementById(
        "gradeModal"
    ).classList.add("active");
}


function saveGrade(){

    const subject =
        document.getElementById(
            "gradeSubject"
        ).value.trim();

    const value =
        Number(
            document.getElementById(
                "gradeValue"
            ).value
        );

    if(!subject){

        alert(
            "Введите предмет."
        );

        return;
    }

    if(
        !Number.isInteger(value) ||
        value < 1 ||
        value > 5
    ){

        alert(
            "Оценка должна быть от 1 до 5."
        );

        return;
    }


    if(editingGradeId){

        const index =
            grades.findIndex(
                g =>
                    String(g.id) ===
                    editingGradeId
            );

        if(index === -1){
            return;
        }

        grades[index] = {

            id:editingGradeId,

            subject,

            value

        };

    }else{

        grades.push({

            id:generateId(),

            subject,

            value

        });
    }

    saveGrades();

    renderGrades();

    closeModal(
        "gradeModal"
    );

    showToast(
        editingGradeId
            ? "Оценка изменена"
            : "Оценка добавлена"
    );

    editingGradeId = null;
}


function deleteGrade(id){

    const index =
        grades.findIndex(
            g =>
                String(g.id) ===
                String(id)
        );

    if(index === -1){
        return;
    }

    if(
        !confirm(
            `Удалить оценку по предмету «${grades[index].subject}»?`
        )
    ){
        return;
    }

    grades.splice(
        index,
        1
    );

    saveGrades();

    renderGrades();

    showToast(
        "Оценка удалена"
    );
}


function deleteEditingGrade(){

    if(!editingGradeId){
        return;
    }

    deleteGrade(
        editingGradeId
    );

    closeModal(
        "gradeModal"
    );

    editingGradeId = null;
}

/* =========================================================
   NAVIGATION
========================================================= */

function showScreen(
    screenId,
    button
){

    document
        .querySelectorAll(".screen")
        .forEach(
            screen =>
                screen.classList.remove(
                    "active"
                )
        );

    document
        .getElementById(screenId)
        .classList.add("active");

    document
        .querySelectorAll(".nav-item")
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    if(button){
        button.classList.add("active");
    }

    if(screenId === "homeScreen"){
        renderHome();
    }

    if(screenId === "editorScreen"){
        renderEditor();
    }

    if(screenId === "gradesScreen"){
        renderGrades();
    }

    if(screenId === "settingsScreen"){
        renderProfile();
        renderColorPicker();
    }
}


/* =========================================================
   MODALS
========================================================= */

function closeModal(id){

    document
        .getElementById(id)
        .classList.remove("active");
}


function closeModalOutside(
    event,
    id
){

    if(event.target.id === id){
        closeModal(id);

}


/* =========================================================
   THEME
========================================================= */

function toggleDarkMode(enabled){

    document.body.classList.toggle(
        "dark",
        enabled
    );

    localStorage.setItem(
        STORAGE_THEME,
        enabled
            ? "dark"
            : "light"
    );
}


function loadTheme(){

    const theme =
        localStorage.getItem(
            STORAGE_THEME
        );

    const dark =
        theme === "dark";

    document.body.classList.toggle(
        "dark",
        dark
    );

    document.getElementById(
        "darkToggle"
    ).checked = dark;
}


/* =========================================================
   ACCENT COLOR
========================================================= */

function applyAccentColor(color){

    document.documentElement
        .style
        .setProperty(
            "--accent",
            color
        );

    /*
       Делаем мягкий вариант
       выбранного цвета автоматически.
    */

    const rgb =
        hexToRgb(color);

    if(rgb){

        document.documentElement
            .style
            .setProperty(
                "--accent-soft",
                `rgba(
                    ${rgb.r},
                    ${rgb.g},
                    ${rgb.b},
                    .10
                )`
            );
    }

    localStorage.setItem(
        STORAGE_ACCENT,
        color
    );

    renderColorPicker();
}


function hexToRgb(hex){

    const value =
        hex.replace("#","");

    if(value.length !== 6){
        return null;
    }

    return {

        r:parseInt(
            value.substring(0,2),
            16
        ),

        g:parseInt(
            value.substring(2,4),
            16
        ),

        b:parseInt(
            value.substring(4,6),
            16
        )
    };
}


function loadAccentColor(){

    const saved =
        localStorage.getItem(
            STORAGE_ACCENT
        );

    if(
        saved &&
        /^#[0-9A-Fa-f]{6}$/.test(saved)
    ){

        applyAccentColor(
            saved
        );

    }else{

        applyAccentColor(
            "#007aff"
        );
    }
}


function renderColorPicker(){

    const container =
        document.getElementById(
            "colorGrid"
        );

    if(!container){
        return;
    }

    const current =
        getComputedStyle(
            document.documentElement
        )
        .getPropertyValue(
            "--accent"
        )
        .trim()
        .toLowerCase();

    container.innerHTML =
        ACCENT_COLORS.map(
            color => `

                <button
                    class="color-button ${
                        color.toLowerCase() ===
                        current
                            ? "active"
                            : ""
                    }"
                    style="
                        background:${color}
                    "
                    onclick="
                        applyAccentColor(
                            '${color}'
                        )
                    "
                    aria-label="Выбрать цвет">
                </button>

            `
        ).join("");
}


/* =========================================================
   RESET
========================================================= */

function clearAllData(){

    if(
        !confirm(
            "Удалить всё расписание, оценки и профиль? Это действие нельзя отменить."
        )
    ){
        return;
    }

    localStorage.removeItem(
        STORAGE_SCHEDULE
    );

    localStorage.removeItem(
        STORAGE_GRADES
    );

    localStorage.removeItem(
        STORAGE_PROFILE
    );

    schedule =
        [[],[],[],[],[],[],[]];

    grades = [];

    profile = {
        name:"",
        group:"",
        course:"",
        faculty:""
    };

    renderHome();
    renderEditor();
    renderGrades();
    renderProfile();

    showToast(
        "Все данные удалены"
    );
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            1800
        );
}


/* =========================================================
   INIT
========================================================= */

function init(){

    loadTheme();

    loadAccentColor();

    renderColorPicker();

    renderHome();

    renderEditor();

    renderGrades();

    renderProfile();

    createSpecificWeekButtons();
}

init();
